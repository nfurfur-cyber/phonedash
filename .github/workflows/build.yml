name: build

# Builds and tests every push and pull request. Releases are built locally with tools/release.mjs (the Play upload key
# never leaves the release computer), so this workflow has no secrets and publishes nothing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node tools/check-release.mjs

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Lint, unit tests and a debug build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew lintDebug assembleDebug testDebugUnitTest --no-daemon --console=plain
      - name: Stream lifecycle regression checks (real Kotlin, gated completion)
        run: python3 tools/test-agent-stream.py

  ui:
    name: UI tests (panel and settings in a browser)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: tools/ui-tests
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run the tests against the web demo
        working-directory: tools/ui-tests
        run: npx playwright test
        env:
          CI: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-test-report
          path: |
            ui-test-report/
            tools/ui-tests/test-results/

  agent:
    name: PC program (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, tfm: net10.0-windows10.0.19041.0 }
          - { os: ubuntu-latest, rid: linux-x64, tfm: net10.0 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Unit tests
        run: dotnet test agent/PhoneBox.Agent.Tests --nologo
      - name: Publish (self-contained, single file; the same build as tools/release.mjs)
        if: matrix.rid == 'win-x64'
        run: dotnet publish agent/PhoneBox.Agent -c Release -f ${{ matrix.tfm }} -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o out --nologo
      # --portable: run in place, without installing itself into the runner's profile
      - name: Smoke test (starts, serves the API)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $version = ([regex]'<Version>([^<]+)</Version>').Match((Get-Content -Raw agent/PhoneBox.Agent/PhoneBox.Agent.csproj)).Groups[1].Value
          $agent = Start-Process out/PhoneDashAgent.exe -ArgumentList '--portable' -PassThru -RedirectStandardOutput agent.log -RedirectStandardError agent.err
          try {
            $info = $null
            for ($i = 0; $i -lt 40 -and -not $info; $i++) {
              try { $info = Invoke-RestMethod http://127.0.0.1:8775/api/info } catch { Start-Sleep 1 }
            }
            if (-not $info) { Get-Content agent.log, agent.err; throw 'the agent did not answer on port 8775' }
            $info | ConvertTo-Json -Depth 4
            if ($info.version -ne $version) { throw "agent reports $($info.version), expected $version" }
            $state = Invoke-RestMethod http://127.0.0.1:8775/api/state
            if (-not $state.pc) { throw 'no PC readings in /api/state' }
          } finally {
            Stop-Process -Id $agent.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.rid == 'win-x64'
        with:
          name: phonedash-pc-${{ matrix.rid }}
          path: out/
